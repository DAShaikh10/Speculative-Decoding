version: 2
updates:
  # Python dependencies, resolved through pyproject.toml and uv.lock.
  - package-ecosystem: uv
    assignees: ["DAShaikh10"]
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]

  # Maintain dependencies for GitHub Actions.
  - package-ecosystem: github-actions
    assignees: ["DAShaikh10"]
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(gha)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
