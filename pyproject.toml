[project]
name = "speculative-decoding"
version = "0.1.0"
description = "Replication of the speculative decoding algorithm from the paper 'Fast Inference of Transformers via Speculative Decoding' by Leviathan et al., 2023."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "sentencepiece>=0.2.2",
    "transformers>=5.20.2",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
]

# torch comes from an extra so the CUDA build can be picked: `uv sync --extra cu128` (Hopper/
# Ampere/Blackwell) or `--extra cu126` (V100). Pinned to 2.7.1 to avoid issues on the RIS Cluster nodes.
[project.optional-dependencies]
cu126 = ["torch==2.7.1"]
cu128 = ["torch==2.7.1"]

[dependency-groups]
# For src/finetune. tensorflow-datasets is only needed for `source: tfds`, `hf` runs without it.
finetune = [
    "importlib-resources>=6.0",  # tensorflow-datasets imports it without declaring it.
    "numpy>=2.0",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    "tensorflow-cpu>=2.16",  # tensorflow-datasets reads and writes through it.
    "tensorflow-datasets>=4.9.0",
]
dev = [
    "black>=26.10.1",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speculative_decoding", "src/finetune"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pylint.main]
ignore = [
    ".venv",
    "__pycache__"
]

[tool.pylint.format]
max-line-length = 120

[tool.ruff]
line-length = 120
target-version = "py312" # Keeps Ruff aligned with your project requirements.

[tool.ruff.lint]
extend-select = ["I"] # Adds isort rules (I) to the default set (E, F)

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ extra = "cu126" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
